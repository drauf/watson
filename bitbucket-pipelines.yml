definitions:
  caches:
    yarn: .yarn/cache
  steps:
    - step: &lint_and_unit_tests
        name: Lint and unit tests
        image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
        caches:
          - yarn
        script:
          - corepack enable
          - YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
          - yarn lint
          - yarn test

    - step: &end_to_end_tests
        name: End-to-end tests
        image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
        clone:
          lfs: true
        caches:
          - yarn
        script:
          - corepack enable
          - YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
          - HOME=/root yarn playwright test
        artifacts:
          upload:
            - name: Playwright report
              type: scoped
              capture-on: failed
              paths:
                - playwright-report/**

pipelines:
  default:
    - parallel:
      - step: *end_to_end_tests
      - step: *lint_and_unit_tests
