definitions:
  caches:
    yarn: .yarn/cache
  steps:
    - step: &lint_and_unit_tests
        name: Lint and unit tests
        image: node:26-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
        caches:
          - yarn
        script:
          - YARN_ENABLE_HARDENED_MODE=0 node .yarn/releases/yarn-4.18.1.cjs install --immutable
          - node .yarn/releases/yarn-4.18.1.cjs lint
          - node .yarn/releases/yarn-4.18.1.cjs test

    - step: &end_to_end_tests
        name: End-to-end tests
        image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
        clone:
          lfs: true
        caches:
          - yarn
        script:
          - YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
          - HOME=/root yarn playwright test
        artifacts:
          upload:
            - name: Playwright report
              type: scoped
              capture-on: failed
              paths:
                - playwright-report/**

pipelines:
  default:
    - parallel:
      - step: *end_to_end_tests
      - step: *lint_and_unit_tests
