definitions:
  caches:
    yarn: .yarn/cache
  steps:
    - step: &lint_and_unit_tests
        name: Lint and unit tests
        image: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
        caches:
          - yarn
        script:
          - corepack enable
          - YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
          - yarn lint
          - yarn test

    - step: &end_to_end_tests
        name: End-to-end tests
        image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
        clone:
          lfs: true
        caches:
          - yarn
        script:
          - YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
          - HOME=/root yarn playwright test
        artifacts:
          upload:
            - name: Playwright report
              type: scoped
              capture-on: failed
              paths:
                - playwright-report/**

pipelines:
  default:
    - parallel:
      - step: *end_to_end_tests
      - step: *lint_and_unit_tests
