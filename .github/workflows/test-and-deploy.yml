name: Test and deploy to Pages

on:
  # Runs on pushes targeting the default branch and pull requests
  push:
    branches: ['main']
  pull_request:

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: yarn

    - run: YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
    - run: yarn lint
    - run: yarn test

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble

    steps:
    - name: Install git-lfs
      run: |
        apt-get update
        apt-get install -y git-lfs

    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Setup Node 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: yarn

    - run: YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
    - name: Run Playwright tests
      run: HOME=/root yarn playwright test
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Build static page for deployment
      run: yarn predeploy
    - name: Upload artifact for deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: 'pages'
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
